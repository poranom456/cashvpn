name: Build VPN APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git zlib1g-dev libncurses5-dev libgdbm-dev \
            libnss3-dev libssl-dev libreadline-dev libsqlite3-dev libffi-dev xterm openjdk-17-jdk \
            autoconf libtool pkg-config

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip setuptools wheel
          # Ставим стабильную версию cython, которая не будет сыпать предупреждениями и не вызовет вылет
          pip install buildozer cython==0.29.36 virtualenv

      - name: Create Buildozer Configuration
        run: |
          buildozer init
          # Настройка базовых параметров приложения
          sed -i 's/^title = .*/title = Cash VPN/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = cashvpn/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy==2.3.0,requests,urllib3,chardet,idna,certifi/' buildozer.spec
          sed -i 's/# android.permissions = .*/android.permissions = INTERNET/' buildozer.spec
          sed -i 's/#android.manifest.application_arguments =.*/android.manifest.application_arguments = android:usesCleartextTraffic="true"/' buildozer.spec
          
          # Задаем жесткие стабильные версии Android API и NDK, чтобы компиляция прошла успешно
          sed -i 's/^android.api = .*/android.api = 33/' buildozer.spec
          sed -i 's/# android.ndk = .*/android.ndk = 25b/' buildozer.spec
          sed -i 's/# android.ndk_api = .*/android.ndk_api = 21/' buildozer.spec

      - name: Build Android APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CashVPN-Android-App
          path: bin/*.apk
