name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git zlib1g-dev libncurses5-dev libgdbm-dev \
            libnss3-dev libssl-dev libreadline-dev libsqlite3-dev libffi-dev xterm openjdk-17-jdk \
            autoconf libtool pkg-config

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.36 virtualenv

      - name: Create Clean Buildozer Spec
        run: |
          rm -f buildozer.spec
          cat << 'EOF' > buildozer.spec
          [app]
          title = Cash VPN
          package.name = cashvpn
          package.domain = org.test
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 0.1
          
          # Оптимальные требования без конфликтов компиляции C-модулей
          requirements = python3,kivy==2.3.0,requests,urllib3==1.26.15,chardet,idna,certifi
          orientation = portrait
          fullscreen = 0

          # Android settings
          android.permissions = INTERNET
          android.api = 33
          android.minapi = 21
          android.ndk_api = 21
          android.private_storage = True
          android.manifest.application_arguments = android:usesCleartextTraffic="true"
          android.archs = arm64-v8a, armeabi-v7a

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF

      - name: Build Android APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CashVPN-Android-App
          path: bin/*.apk
